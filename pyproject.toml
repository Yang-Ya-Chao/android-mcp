[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "android-mcp"
version = "0.1.0"
description = "A local MCP server for safe Kotlin/Android project workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0"]

[project.scripts]
android-mcp = "android_mcp.server:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
android_mcp = ["resources/*.md"]
